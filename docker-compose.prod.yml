# ============================================================
# Docker Compose - Production Configuration
# AI Chatbot Full Stack Application
# Phase 3 - MongoDB + PostgreSQL Hybrid
# ============================================================

version: '3.8'

services:
  # ==========================================
  # Primary Database - MongoDB (Replica Set)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: chatbot-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MongoDB root password required}
      MONGO_INITDB_DATABASE: chatbot
    command: --replSet rs0 --bind_ip_all --auth
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongodb-prod.sh:/docker-entrypoint-initdb.d/init-mongodb.sh:ro
    ports:
      - '27017:27017'
    networks:
      - chatbot-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ==========================================
  # Secondary Database - PostgreSQL (Migration Period)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-myapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-myapp_prod}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    networks:
      - chatbot-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-myapp}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Cache - Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - chatbot-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend Services
  # ==========================================

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: chatbot-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-myapp}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:-myapp_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT refresh secret required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    networks:
      - chatbot-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Service
  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    container_name: chatbot-admin-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-myapp_prod}
      DB_USER: ${DB_USER:-myapp}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3002:3002'
    networks:
      - chatbot-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Chatbot Service (MongoDB + PostgreSQL Hybrid)
  chatbot-service:
    build:
      context: .
      dockerfile: apps/chatbot-service/Dockerfile
    container_name: chatbot-chatbot-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # MongoDB (Primary)
      MONGODB_URI: mongodb://chatbot_user:${MONGO_APP_PASSWORD:?MongoDB app password required}@mongodb:27017/chatbot?authSource=admin
      MONGODB_POOL_MIN: ${MONGODB_POOL_MIN:-5}
      MONGODB_POOL_MAX: ${MONGODB_POOL_MAX:-20}
      # PostgreSQL (Secondary - Migration Period)
      DATABASE_URL: postgresql://${DB_USER:-myapp}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:-myapp_prod}
      PG_POOL_MIN: ${PG_POOL_MIN:-5}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      # Read Switcher Configuration
      MONGODB_READ_PERCENTAGE: ${MONGODB_READ_PERCENTAGE:-0}
      DUAL_READ_ENABLED: ${DUAL_READ_ENABLED:-false}
      DUAL_WRITE_ENABLED: ${DUAL_WRITE_ENABLED:-true}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      # Auth & Security
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OpenAI API key required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
      OPENAI_CONTEXT_WINDOW: ${OPENAI_CONTEXT_WINDOW:-10}
      USE_MOCK_AI: ${USE_MOCK_AI:-false}
      # Rate Limiting
      RATE_LIMIT_MAX_MESSAGES: ${RATE_LIMIT_MAX_MESSAGES:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Monitoring
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
      - '9091:9091' # Metrics port
    networks:
      - chatbot-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ==========================================
  # Frontend - Shell App with Nginx
  # ==========================================
  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    container_name: chatbot-shell
    restart: unless-stopped
    depends_on:
      - auth-service
      - admin-service
      - chatbot-service
    ports:
      - '${SHELL_PORT:-80}:80'
    networks:
      - chatbot-network
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================
  # Reverse Proxy - Nginx (Optional)
  # Uncomment if you want a separate reverse proxy
  # ==========================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: chatbot-nginx
  #   restart: unless-stopped
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   networks:
  #     - chatbot-network
  #   depends_on:
  #     - shell
  #     - auth-service
  #     - admin-service
  #     - chatbot-service

# ==========================================
# Networks
# ==========================================
networks:
  chatbot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

