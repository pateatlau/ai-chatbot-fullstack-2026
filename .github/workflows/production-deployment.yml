name: Production Deployment

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==========================================
  # Build and Push Docker Images
  # ==========================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - auth-service
          - admin-service
          - chatbot-service
          - shell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ==========================================
  # Deploy to Staging
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.your-domain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to Staging Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd /opt/chatbot-app
            
            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull
            
            # Stop services
            docker-compose -f docker-compose.prod.yml down
            
            # Start services
            docker-compose -f docker-compose.prod.yml --env-file .env.staging up -d
            
            # Run migrations
            docker-compose -f docker-compose.prod.yml exec -T auth-service sh -c "cd prisma && npx prisma migrate deploy"
            docker-compose -f docker-compose.prod.yml exec -T chatbot-service sh -c "cd prisma && npx prisma migrate deploy"
            
            # Health check
            sleep 10
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost:3002/health || exit 1
            curl -f http://localhost:3001/health || exit 1
          EOF

      - name: Run Smoke Tests
        run: |
          npm ci
          npm run test:smoke -- --env=staging

  # ==========================================
  # Deploy to Production
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://your-domain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Create Backup
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            # Backup database
            BACKUP_DIR="/backups/postgres"
            DATE=$(date +%Y%m%d_%H%M%S)
            mkdir -p $BACKUP_DIR
            docker-compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U myapp -F c myapp_prod > $BACKUP_DIR/backup_$DATE.dump
            
            echo "Backup created: $BACKUP_DIR/backup_$DATE.dump"
          EOF

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /opt/chatbot-app
            
            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull
            
            # Blue-Green Deployment: Start new containers
            docker-compose -f docker-compose.prod.yml up -d --no-deps --scale auth-service=2
            
            # Wait for new containers to be healthy
            sleep 15
            
            # Run migrations
            docker-compose -f docker-compose.prod.yml exec -T auth-service sh -c "cd prisma && npx prisma migrate deploy"
            docker-compose -f docker-compose.prod.yml exec -T chatbot-service sh -c "cd prisma && npx prisma migrate deploy"
            
            # Health check new containers
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost:3002/health || exit 1
            curl -f http://localhost:3001/health || exit 1
            
            # Stop old containers
            docker-compose -f docker-compose.prod.yml up -d --scale auth-service=1
            
            # Cleanup old images
            docker image prune -f
          EOF

      - name: Run Smoke Tests
        run: |
          npm ci
          npm run test:smoke -- --env=production

      - name: Notify Team
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ==========================================
  # Rollback (Manual Trigger)
  # ==========================================
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: Rollback Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd /opt/chatbot-app
            
            # Restore from backup
            LATEST_BACKUP=$(ls -t /backups/postgres/*.dump | head -1)
            echo "Restoring from: $LATEST_BACKUP"
            
            # Stop services
            docker-compose -f docker-compose.prod.yml down
            
            # Restore database
            docker-compose -f docker-compose.prod.yml up -d postgres
            sleep 5
            docker-compose -f docker-compose.prod.yml exec -T postgres \
              pg_restore -U myapp -d myapp_prod -c $LATEST_BACKUP || true
            
            # Deploy previous version
            git checkout HEAD~1
            docker-compose -f docker-compose.prod.yml up -d
            
            # Health check
            sleep 10
            curl -f http://localhost:3000/health || exit 1
          EOF
