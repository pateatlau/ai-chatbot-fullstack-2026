# Prometheus Configuration for AI Chatbot Services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'chatbot-production'
    environment: 'prod'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL Exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgresql'

  # MongoDB Exporter
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mongodb'

  # Chatbot Service
  - job_name: 'chatbot-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['chatbot-service:9091']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'chatbot-service'

  # Auth Service
  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:9092']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'auth-service'

  # Admin Service
  - job_name: 'admin-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['admin-service:9093']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'admin-service'

  # GraphQL Gateway
  - job_name: 'graphql-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['graphql-gateway:9094']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'graphql-gateway'

  # Node Exporter (System Metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'node'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'
